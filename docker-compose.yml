services:
  tr4ker-addon:
    build: .
    container_name: tr4ker-addon
    restart: unless-stopped

    environment:
      PORT: 7000
      PUBLIC_URL: https://tr4ker.lyno.top
      REQUEST_TIMEOUT_MS: 15000
      MAX_RESULTS: 50

    expose:
      - "7000"

    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
