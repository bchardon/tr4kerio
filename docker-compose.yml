services:
  tr4kerio:
    build: .
    container_name: tr4kerio
    restart: unless-stopped

    environment:
      PORT: 7000
      TORZNAB_URL: https://tr4ker.net/api/torznab
      REQUEST_TIMEOUT_MS: 15000
      RESULTS_PER_QUALITY: 2

    expose:
      - "7000"

    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
