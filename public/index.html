<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TR4KER - Addon Stremio</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="card">

    <div class="brand">
      TR4KER
    </div>

    <h1>Addon Stremio</h1>

    <p class="intro">
      Configure ta clé API puis installe directement l'addon dans Stremio.
    </p>

    <form id="config-form">

      <label for="apikey">
        Clé API TR4KER
      </label>

      <input id="apikey" name="apikey" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false"
        data-1p-ignore data-bwignore data-lpignore="true" placeholder="tr4k_xxxxxxxxxxxxxxxxxxxxx">

      <label for="quality">Qualités proposées</label>

      <select id="quality" name="quality">
        <option value="720p,1080p" selected>
          720p + 1080p
        </option>

        <option value="1080p,4k">
          1080p + 4K
        </option>

        <option value="720p,1080p,4k">
          720p + 1080p + 4K
        </option>

        <option value="720p">
          720p uniquement
        </option>

        <option value="1080p">
          1080p uniquement
        </option>

        <option value="4k">
          4K uniquement
        </option>
      </select>

      <button id="submit-button" type="submit">
        Installer dans Stremio
      </button>

    </form>

    <section id="result" hidden>

      <label for="manifest-url">
        URL du Manifest
      </label>

      <div class="copy-row">

        <input id="manifest-url" type="text" readonly>

        <button id="copy" type="button" class="secondary">
          Copier
        </button>

      </div>

      <a id="install-link" class="install-link" href="#">
        Ouvrir Stremio
      </a>

    </section>

    <p class="notice">
      La clé API est encodée dans l'URL du manifest.
      Ne partage pas cette URL.
    </p>

  </main>

  <!-- IMPORTANT -->
  <script src="/app.js?v=1.0.3"></script>

</body>

</html>
