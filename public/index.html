<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TR4KERIO - Addon C411 pour Nuvio et Stremio</title>

  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="card">

    <div class="brand">
      TR4KERIO
    </div>

    <h1>Configuration de l'addon</h1>

    <p class="intro">
      Configure ta clé API et les qualités à proposer.
    </p>

    <form id="config-form">

      <label for="apikey">
        Clé API C411
      </label>

      <input id="apikey" name="apikey" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false"
        data-1p-ignore data-bwignore data-lpignore="true" placeholder="Clé API de ton profil C411">

      <label for="quality">Qualités proposées</label>

      <select id="quality" name="quality">
        <option value="720p,1080p">
          720p + 1080p
        </option>

        <option value="1080p,4k" selected>
          1080p + 4K
        </option>

        <option value="720p,1080p,4k">
          720p + 1080p + 4K
        </option>

        <option value="720p">
          720p uniquement
        </option>

        <option value="1080p">
          1080p uniquement
        </option>

        <option value="4k">
          4K uniquement
        </option>
      </select>

      <div class="install-button">
        <button type="submit">
          Installer via HTTPS
        </button>
      </div>

    </form>

    <section id="result" hidden>

      <label for="manifest-url">
        URL du Manifest
      </label>

      <div class="copy-row">

        <input id="manifest-url" type="text" readonly>

        <button id="copy" type="button" class="secondary">
          Copier
        </button>

      </div>

      <a id="install-link" class="install-link" href="#">
        Ouvrir l'application
      </a>

    </section>

    <p class="notice">
      La clé API est encodée dans l'URL du manifest.
      Ne partage pas cette URL.
    </p>

  </main>

  <!-- IMPORTANT -->
  <script src="/app.js?v=1.1.0"></script>

</body>

</html>
